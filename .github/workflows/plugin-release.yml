name: Plugin Release

# 插件 APK 发布(N-APP-001 FR-004/FR-005):dispatch → 签名构建 →
# apksigner 门禁 → GitHub Release(v{plugin.json version})+ APK 资产。
# 发布后 Abyss-Plugins 的 sync-index 自动探测 apk 字段,
# 宿主 downloadApk() 即刻可装。

on:
  workflow_dispatch: {}

concurrency:
  group: plugin-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Decode plugin keystore (secrets)
        env:
          ABYSS_PLUGIN_KEYSTORE_B64: ${{ secrets.ABYSS_PLUGIN_KEYSTORE_B64 }}
        run: |
          if [ -z "$ABYSS_PLUGIN_KEYSTORE_B64" ]; then
            echo "::error::缺少 ABYSS_PLUGIN_KEYSTORE_B64 —— 发布必须有签名材料(fail-closed)"
            exit 1
          fi
          KS_DIR="$RUNNER_TEMP/abyss-plugin-signing"
          mkdir -p "$KS_DIR"
          printf '%s' "$ABYSS_PLUGIN_KEYSTORE_B64" | base64 -d > "$KS_DIR/plugin-release.p12"
          echo "ABYSS_PLUGIN_KEYSTORE_FILE=$KS_DIR/plugin-release.p12" >> "$GITHUB_ENV"
          echo "ABYSS_PLUGIN_KEYSTORE_PASSWORD=$ABYSS_PLUGIN_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ABYSS_PLUGIN_KEY_ALIAS=$ABYSS_PLUGIN_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ABYSS_PLUGIN_KEY_PASSWORD=$ABYSS_PLUGIN_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "插件签名材料就绪(PKCS12,不回显机密值)"

      - name: Assemble signed release APK
        env:
          ABYSS_PLUGIN_KEYSTORE_PASSWORD: ${{ secrets.ABYSS_PLUGIN_KEYSTORE_PASSWORD }}
          ABYSS_PLUGIN_KEY_ALIAS: ${{ secrets.ABYSS_PLUGIN_KEY_ALIAS }}
          ABYSS_PLUGIN_KEY_PASSWORD: ${{ secrets.ABYSS_PLUGIN_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Enforce signature (apksigner) & record fingerprint
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -n "$APKSIGNER" ] || { echo "::error::runner 未找到 apksigner"; exit 1; }
          if ! "$APKSIGNER" verify "$APK"; then
            echo "::error::APK 签名校验失败 —— 拒绝发布"; exit 1
          fi
          FP=$("$APKSIGNER" verify --print-certs "$APK" | grep -oP 'SHA-256 digest:\s*\K[0-9a-f]+' | head -1 | tr 'a-f' 'A-F')
          echo "签名指纹: $FP"
          echo "FINGERPRINT=$FP" >> "$GITHUB_ENV"

      - name: Read version & locate APK
        id: meta
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('plugin.json'))['version'])")
          PID=$(python3 -c "import json; print(json.load(open('plugin.json'))['id'])")
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          ASSET="abyss-plugin-${PID#abyss-plugin-}-v${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pid=$PID" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"

      - name: Create / reuse Release & upload APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.meta.outputs.version }}"
          ASSET="${{ steps.meta.outputs.asset }}"
          APK="${{ steps.meta.outputs.apk }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "复用既有 Release $TAG"
            gh release upload "$TAG" "$APK#$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK#$ASSET" --repo "$GITHUB_REPOSITORY" \
              --title "${{ steps.meta.outputs.pid }} $TAG" \
              --notes "- ${{ steps.meta.outputs.pid }} $TAG 签名 APK(指纹 \`${FINGERPRINT:0:16}…\`)。安装走系统安装器;宿主插件中心可直装。"
          fi
          echo "✓ 发布完成:$ASSET"
