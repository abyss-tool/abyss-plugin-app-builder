name: Plugin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 插件清单门禁
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pynacl (N-SEC-001 验签依赖)
        run: pip install --quiet pynacl

      - name: Validate plugin manifest & patch channel
        run: |
          chmod +x tools/validate_plugin.py
          python3 tools/validate_plugin.py

  build:
    name: Gradle 构建 + 纯 JVM 单测（N-APP-001 FR-006）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.14（与主壳整组对齐）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      # 签名材料经 secrets 注入（N-APP-001 FR-004：插件独立 keystore）；
      # 缺失时 release 降级 unsigned —— 编译门禁照常，发布门禁由
      # Release 步骤的指纹校验兜底（与主仓 ci.yml 同模式）。
      # ── 插件签名材料注入(N-APP-001 FR-004:PKCS12 经 secrets)────
      # 缺失时保持 unsigned 兜底语义(编译门禁照常)
      - name: Decode plugin keystore (secrets)
        env:
          ABYSS_PLUGIN_KEYSTORE_B64: ${{ secrets.ABYSS_PLUGIN_KEYSTORE_B64 }}
        run: |
          if [ -n "$ABYSS_PLUGIN_KEYSTORE_B64" ]; then
            KS_DIR="$RUNNER_TEMP/abyss-plugin-signing"
            mkdir -p "$KS_DIR"
            printf '%s' "$ABYSS_PLUGIN_KEYSTORE_B64" | base64 -d > "$KS_DIR/plugin-release.p12"
            echo "ABYSS_PLUGIN_KEYSTORE_FILE=$KS_DIR/plugin-release.p12" >> "$GITHUB_ENV"
            echo "ABYSS_PLUGIN_KEYSTORE_PASSWORD=$ABYSS_PLUGIN_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ABYSS_PLUGIN_KEY_ALIAS=$ABYSS_PLUGIN_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ABYSS_PLUGIN_KEY_PASSWORD=$ABYSS_PLUGIN_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "插件签名材料已注入(PKCS12)"
          else
            echo "::warning::未配置 ABYSS_PLUGIN_KEYSTORE_B64 —— release 产 unsigned 包"
          fi

      - name: Assemble debug + release（unsigned 兜底）
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Run pure-JVM unit tests
        run: gradle test --stacktrace

      - name: Upload test report（失败可读）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-builder-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
